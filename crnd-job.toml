# crnd v0.2.5 job fragment. Never import this file alone: import replaces ALL jobs.
# Merge into a private full export first; see README.md. Keep paused until rollout checks pass.
[jobs.discord-link-summarizer]
command = [
  "/usr/bin/env",
  "-u",
  "DISCORD_BOT_TOKEN",
  "-u",
  "OPENCODE_DB",
  "/Users/chris/.bun/bin/bun",
  "--env-file=/absolute/private/summarizer.env",
  "/absolute/checkout/apps/summarizer/src/index.ts",
  "--config",
  "/absolute/checkout/config.yml",
]
cwd = "/absolute/checkout"
schedule = "* * * * *"
timezone = "Asia/Seoul"
overlap_policy = "skip"
timeout_ms = 2100000
paused = true

# Keep DISCORD_BOT_TOKEN and the isolated OPENCODE_DB in the private env file.
# crnd v0.2.5 rejects TOML env tables because its parser attaches symbol metadata.
# Unset inherited values first: Bun's env-file does not override process environment.
