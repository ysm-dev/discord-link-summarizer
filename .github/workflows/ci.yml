name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout needs read access to this private repository.
permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    # Machine-lock tests exercise macOS /usr/bin/lockf in descriptor mode.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: /usr/bin/lockf -t 0 3 3>"$RUNNER_TEMP/lockf-smoke"
      - uses: oven-sh/setup-bun@v2.2.0
      # Vitest requires Node >= 22.12 and does not support the bun runtime with
      # the v8 coverage provider. bun installs and runs scripts; Node runs tests.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      - run: bun run ci
